name: EAS Android Build

on:
  # Fires when ayurveda-app files change — but the job below checks for [build] flag.
  # To trigger a build: include [build] anywhere in your commit message.
  # Normal pushes (without [build]) are ignored, saving EAS free-tier quota.
  push:
    branches:
      - main
    paths:
      - 'ayurveda-app/**'

  # Manual trigger from GitHub UI → Actions tab (always runs regardless of flag)
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: EAS Build (Android)
    runs-on: ubuntu-latest
    # Only run on push when commit message contains [build]
    # workflow_dispatch always runs (github.event_name != 'push')
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ayurveda-app/package-lock.json

      - name: Install dependencies
        working-directory: ayurveda-app
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: ayurveda-app
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive

      - name: Notify on success
        if: success()
        run: echo "Build submitted successfully! Check https://expo.dev to download APK."

      - name: Notify on failure
        if: failure()
        run: echo "Build failed. Check logs above."
