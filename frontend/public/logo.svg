<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark forest green background -->
  <rect width="32" height="32" rx="7" fill="#1a3a2a"/>

  <!-- Infinity/lemniscate in gold — the Oroganix brand symbol -->
  <path
    d="M16,16
       C15.2,13.8 13.4,11.5 11.2,11.2
       C8.6,10.8 6.4,12.6 6.2,15
       C6.0,17.5 8.0,19.6 10.6,19.4
       C13.0,19.2 14.8,17.2 16,16
       C17.2,14.8 19.0,12.8 21.4,12.6
       C24.0,12.4 26.0,14.5 25.8,17
       C25.6,19.4 23.4,21.2 20.8,20.8
       C18.6,20.5 16.8,18.2 16,16Z"
    fill="none"
    stroke="#c9a84c"
    stroke-width="2.4"
    stroke-linecap="round"
  />

  <!-- Left leaf bud -->
  <ellipse cx="8.5" cy="11.5" rx="2" ry="1.2"
    fill="#4a9e6a"
    transform="rotate(-35 8.5 11.5)"
  />

  <!-- Right leaf bud -->
  <ellipse cx="23.5" cy="11.5" rx="2" ry="1.2"
    fill="#4a9e6a"
    transform="rotate(35 23.5 11.5)"
  />

  <!-- Centre dot -->
  <circle cx="16" cy="16" r="1.4" fill="#c9a84c" opacity="0.85"/>
